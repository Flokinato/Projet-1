<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hello world</title>
<link rel="stylesheet" href="../CSS/global.css">
<link rel="stylesheet" href="../CSS/contact.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,200..800&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,200..800&family=Sora:wght@100..800&display=swap" rel="stylesheet">
</head>
<body>
    <script src="..\JS\header.js" defer></script>
    <site-header data-page="contact"></site-header>
    <main>
        <section class="hero_contact">
            <div class="div_card">
                <h1 class="h1_contact"><del class="del_contact">Essayez</del> <span class="span_contact">Osez</span> nous</h1>
                <div class="div_contact">
                    <form class="form_contact">
                        <div class="div_label">
                            <label for="nom" class="label_contact">Nom</label>
                            <br>
                            <input type="text" class="input_contact" name="nom" id="nom" placeholder="nom">
                        </div>
                        <br><br>
                        <div class="div_label">
                            <label for="prenom" class="label_contact">Prenom</label>
                            <br>
                            <input type="text" class="input_contact" name="prenom" id="prenom" placeholder="prenom">
                        </div>
                        <br><br>
                        <div class="div_label">
                            <label for="email" class="label_contact">Email</label>
                            <br>
                            <input type="email" class="input_contact" name="email" id="email" placeholder="email">
                        </div>
                        <br><br>
                        <div class="div_label">
                            <label for="telephone" class="label_contact">Téléphone</label>
                            <br>
                            <input type="tel" class="input_contact" name="telephone" id="telephone" placeholder="telephone">
                        </div>
                        <br><br>
                        <div class="div_label">
                            <label for="message" class="label_contact">Message</label>
                            <br>
                            <textarea name="message" id="message" class="textarea_contact" placeholder="Ecrivez votre message"></textarea>
                        </div>
                        <br>
                        <button type="submit" class="button_form"><del class="del_button">Envoyer</del> Osez</button>
                    </form>
                </div>
            </div>
        </section>
    </main>
    <script src="..\JS\footer.js" defer></script>
    <site-footer></site-footer>
</body>

</html>
